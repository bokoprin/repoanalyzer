name: Diagnose Model Color Source

on:
  push:
    branches:
      - tmp/model-color-apk-build-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github.raw+json' \
            -o model-color-source.tar.xz \
            'https://api.github.com/repos/bokoprin/repoanalyzer/contents/model-color-source.tar.xz?ref=tmp/model-color-apk-build-20260714'
          stat model-color-source.tar.xz
          file model-color-source.tar.xz
          sha256sum model-color-source.tar.xz
          xz -tv model-color-source.tar.xz
          tar -tJf model-color-source.tar.xz | head -30
          mkdir -p build-source
          tar -xJf model-color-source.tar.xz -C build-source
          find build-source -name gradlew -type f -print
