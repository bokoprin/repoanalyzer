name: Diagnose Model Color Source

on:
  push:
    branches:
      - tmp/model-color-apk-build-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source archive
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah
          stat model-color-source.tar.xz
          file model-color-source.tar.xz
          sha256sum model-color-source.tar.xz
          xz -tv model-color-source.tar.xz
          tar -tJf model-color-source.tar.xz | head -30
          mkdir -p build-source
          tar -xJvf model-color-source.tar.xz -C build-source
          find build-source -maxdepth 3 -type f | head -50
          find build-source -name gradlew -type f -print
