name: Build Model Color APK

on:
  push:
    branches:
      - tmp/model-color-apk-build-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0'

      - name: Extract application source
        shell: bash
        run: |
          mkdir -p build-source
          tar -xJf model-color-source.tar.xz -C build-source
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-source" -name gradlew -type f -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Run unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/app-debug.apk.sha256"
          jarsigner -verify "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7
