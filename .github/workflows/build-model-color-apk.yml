name: Build Model Color APK

on:
  push:
    branches:
      - tmp/model-color-apk-build-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Select preinstalled Android platform
        shell: bash
        run: |
          SDK_PLATFORM="$(find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sed -n 's/^android-//p' | sort -V | tail -n 1)"
          test -n "$SDK_PLATFORM"
          echo "SDK_PLATFORM=${SDK_PLATFORM}" >> "$GITHUB_ENV"
          echo "Using Android API ${SDK_PLATFORM}"

      - name: Extract application source
        shell: bash
        run: |
          xz -t model-color-source.tar.xz
          mkdir -p build-source
          tar -xJf model-color-source.tar.xz -C build-source
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/build-source" -name settings.gradle.kts -type f -print -quit)"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ "$SDK_PLATFORM" != '37' ]; then
            sed -i "s/compileSdk = 37/compileSdk = ${SDK_PLATFORM}/" "$PROJECT_DIR/app/build.gradle.kts"
            sed -i "s/targetSdk = 37/targetSdk = ${SDK_PLATFORM}/" "$PROJECT_DIR/app/build.gradle.kts"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Run unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee "$GITHUB_WORKSPACE/app-debug.apk.sha256"
          jarsigner -verify "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7
