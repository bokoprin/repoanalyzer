name: Build ModelColor APK

on:
  push:
    branches:
      - tmp/model-color-apk-build-20260714
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf tmp-model-color-build/model-color-source.tar.xz
          test -f model-color-android/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build and test
        working-directory: model-color-android
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-color-build-reports
          path: |
            model-color-android/app/build/reports/**
            model-color-android/app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: model-color-debug-apk
          path: model-color-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
